<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="支线 · 发现日常的小变化，留下自己的记录。">
  <meta name="theme-color" content="#234D3C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="支线">
  <!-- 主屏幕图标：iOS 会按 URL 长期缓存，换图时必须换文件名（180×180 为 iOS 标准尺寸） -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>支线</title>
  <link rel="manifest" href="manifest.json">

  <!-- 预加载启动关键资源：应用代码 + 引擎脚本（变体按浏览器选择；wasm 不做预加载——
       与引擎的 fetch 模式不匹配会重复下载，实测 WebKit 下 wasm 预加载反而更慢） -->
  <link rel="preload" href="main.dart.js" as="script">
  <script>
    (function () {
      var ua = navigator.userAgent;
      // WebKit 系（Safari / iOS 微信等）与 Firefox 用完整版引擎，其余（Chrome 系）用精简版。
      var fullVariant = (/Safari\//.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|EdgiOS|OPiOS|Edg\//.test(ua)) || /Firefox\//.test(ua);
      var l = document.createElement('link');
      l.rel = 'preload';
      l.href = (fullVariant ? 'canvaskit/' : 'canvaskit/chromium/') + 'canvaskit.js';
      l.as = 'script';
      l.crossOrigin = 'anonymous';
      document.head.appendChild(l);
    }());
  </script>

  <style>
    /* 启动画面：首帧渲染前替代白屏，渲染后由 flutter_bootstrap.js 移除 */
    #boot-splash {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: #F7F6F0;
      transition: opacity .35s ease;
    }
    #boot-splash.boot-splash-hide { opacity: 0; pointer-events: none; }
    .boot-splash-box { text-align: center; animation: boot-breathe 1.5s ease-in-out infinite; }
    .boot-splash-mark {
      display: inline-block; width: 64px; height: 64px; border-radius: 16px; margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(35, 77, 60, .18);
    }
    .boot-splash-logo {
      font: 600 30px/1.3 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      color: #234D3C; letter-spacing: .14em; padding-left: .14em;
    }
    .boot-splash-note {
      margin-top: 12px;
      font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      color: #69756C; letter-spacing: .06em;
    }
    @keyframes boot-breathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

    /* 添加到主屏幕提示：仅 iPhone/iPad Safari，弹窗式、可关闭，关掉后不再提示 */
    #add-to-home {
      position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 10; display: flex; justify-content: center;
      pointer-events: none; padding: 0 12px;
    }
    #add-to-home[hidden] { display: none; }
    .hint-card {
      position: relative; pointer-events: auto;
      background: #234D3C; color: #F7F6F0;
      border-radius: 18px; padding: 14px 48px 14px 20px;
      max-width: 92vw; box-shadow: 0 6px 20px rgba(32, 59, 49, .28);
      font: 15px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      animation: hint-in .45s cubic-bezier(.22, .9, .36, 1) both;
    }
    .hint-title { font-size: 16px; font-weight: 600; }
    .hint-body { margin-top: 3px; opacity: .92; }
    .hint-card b { font-weight: 600; }
    .hint-close {
      position: absolute; top: 4px; right: 4px;
      width: 38px; height: 38px; border: 0; padding: 0; margin: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: rgba(247, 246, 240, .75);
      font-size: 22px; line-height: 1; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hint-close:active { color: #F7F6F0; }
    @keyframes hint-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-splash-box">
      <img class="boot-splash-mark" src="icons/Icon-192.png" alt="">
      <div class="boot-splash-logo">支线</div>
      <div class="boot-splash-note">正在准备…</div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- 卸掉早期版本注册过的 Service Worker。装到桌面后，旧缓存会绕过已修好的页面，再次白屏。 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- 只在 iPhone/iPad 的 Safari 中弹出一次（可关闭，关掉后记住不再提示） -->
  <div id="add-to-home" hidden>
    <div class="hint-card">
      <button class="hint-close" type="button" aria-label="关闭">×</button>
      <div class="hint-title">把支线放到桌面</div>
      <div class="hint-body">点底部的 <b>分享</b>，选「添加到主屏幕」</div>
    </div>
  </div>
  <script>
    (function () {
      var standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var ua = window.navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua);
      var iosSafari = ios && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/.test(ua);
      var dismissed = false;
      try { dismissed = window.localStorage.getItem('sq-hint-add-home') === '1'; } catch (e) {}
      if (standalone || !iosSafari || dismissed) return;
      var box = document.getElementById('add-to-home');
      var shown = false;
      var showOnce = function () {
        if (shown) return;
        shown = true;
        setTimeout(function () { box.hidden = false; }, 500);
      };
      // 等应用首帧渲染后再弹出，避免和应用启动抢注意力（6 秒兜底）
      window.addEventListener('flutter-first-frame', showOnce);
      setTimeout(showOnce, 6000);
      box.querySelector('.hint-close').addEventListener('click', function () {
        box.hidden = true;
        try { window.localStorage.setItem('sq-hint-add-home', '1'); } catch (e) {}
      });
    }());
  </script>
</body>
</html>
