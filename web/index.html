<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="支线 · 发现日常的小变化，留下自己的记录。">
  <meta name="theme-color" content="#234D3C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="支线">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>支线</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #add-to-home {
      position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 10; display: flex; justify-content: center; pointer-events: none;
    }
    #add-to-home span {
      background: #234D3C; color: #F7F6F0; font: 13px/1.6 -apple-system, "PingFang SC", system-ui, sans-serif;
      padding: 8px 16px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
    }
    #add-to-home b { font-weight: 600; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- 只在 iPhone/iPad 的 Safari 中、且尚未“添加到主屏幕”时，提示一次放置入口 -->
  <div id="add-to-home" hidden>
    <span>把支线放到桌面：点底部的 <b>分享</b>，选「添加到主屏幕」</span>
  </div>
  <script>
    (function () {
      var standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var ua = window.navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua);
      var iosSafari = ios && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/.test(ua);
      if (!standalone && iosSafari) {
        document.getElementById('add-to-home').hidden = false;
      }
    }());
  </script>
</body>
</html>
